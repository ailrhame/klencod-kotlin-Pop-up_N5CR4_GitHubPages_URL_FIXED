<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111116"><title>Pop-up</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;display:grid;place-items:center;background:#101014;color:#f5f5f7;font-family:system-ui,sans-serif}
main{width:min(100%,520px);padding:26px;border:1px solid #343440;border-radius:22px;background:#1b1b23;box-shadow:0 18px 60px #0008}
.brand{color:#ffc247;font-weight:800}h1{font-size:25px}.muted{color:#c6c6d0;line-height:1.8}
#count{color:#ffc247;font-size:14px;margin:16px 0 8px}#message{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;line-height:1.8;background:#252530;border-radius:14px;padding:18px;min-height:90px}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:#ffc247;color:#17130b;font-size:16px;font-weight:700}
footer{margin-top:16px;color:#9292a0;font-size:12px}
</style></head>
<body><main aria-live="polite">
<div class="brand">POP-UP</div><h1 id="title">رسالة</h1>
<p class="muted" id="intro">اضغط متابعة لعرض الرسائل.</p>
<div id="count"></div><div id="message"></div><button id="next">متابعة</button>
<footer>صفحة ويب مستقلة — لا تحتاج إلى تثبيت التطبيق</footer>
</main>
<script>
(() => {
 const p=new URLSearchParams(location.search);
 const raw=Number.parseInt(p.get('count')||'1',10);
 const total=Number.isFinite(raw)?Math.max(1,Math.min(50,raw)):1;
 const msg=p.get('message')||'مرحباً بك!';
 let target=p.get('url')||'';
 if(target&&!/^https?:\/\//i.test(target)) target='https://'+target;
 try { const u=new URL(target); target=(u.protocol==='http:'||u.protocol==='https:')?u.href:''; } catch(e){target='';}
 const title=document.getElementById('title'),intro=document.getElementById('intro'),counter=document.getElementById('count'),box=document.getElementById('message'),btn=document.getElementById('next');
 if(!p.has('count')||!p.has('url')||!target){intro.textContent='الرابط غير مكتمل أو الرابط المستهدف غير صالح.';btn.hidden=true;return;}
 let n=1;
 function draw(){title.textContent='رسالة من Pop-up';intro.textContent='اضغط متابعة للانتقال إلى الرسالة التالية.';counter.textContent=`النافذة ${n} من ${total}`;box.textContent=msg;btn.textContent=n<total?'التالي':'فتح الرابط المستهدف';}
 draw();
 btn.addEventListener('click',()=>{if(n<total){n++;draw();}else{location.href=target;}});
})();
</script></body></html>
